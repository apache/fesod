name: Java CI

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'website/**'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches: [ main ]
    paths-ignore:
      - 'website/**'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache Local Maven Repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Check code style
        run: ./mvnw spotless:check

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        java: [ 8, 11, 17, 21, 25 ]
        distribution: [ 'temurin' ]
      fail-fast: false
      max-parallel: 5

    name: Test JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}
      - name: Cache local Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2
      - name: Test with Maven
        run: ./mvnw clean package -B -pl fesod-common,fesod-shaded,fesod-beans/fesod-beans-cglib,fesod-sheet
      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        if: (!cancelled())
        with:
          files: "**/target/surefire-reports/*.xml"
      - name: Maven Build
        # Tests already ran in the previous step; skip here to avoid a second full run
        run: ./mvnw install -B -V -DskipTests
      - name: Java Doc
        run: ./mvnw javadoc:javadoc

  test-windows:
    # Run only tests tagged with Tags.WINDOWS, which Windows-only tests pair with the built-in
    # @EnabledOnOs(OS.WINDOWS). The Linux matrix sees the same tests but JUnit skips them there.
    runs-on: windows-2022
    strategy:
      matrix:
        java: [ 8, 11, 17, 21, 25 ]
        distribution: [ 'temurin' ]
      fail-fast: false
      max-parallel: 5
    name: Test Windows JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}
      - name: Cache local Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2
      - name: Test Windows
        # Use package (not test): fesod-shaded only produces the relocated cglib classes in its shaded jar.
        # Quote -Dtest.groups: unquoted, PowerShell splits the argument at the dot.
        run: ./mvnw.cmd clean package -B -pl fesod-common,fesod-shaded,fesod-sheet '-Dtest.groups=windows'
