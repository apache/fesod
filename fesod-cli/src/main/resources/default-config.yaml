# Apache Fesod CLI Default Configuration
# This file contains default settings for the CLI tool
# Copy this file to ~/.fesod/config.yaml and modify as needed

# Default settings
defaults:
  # Default output format for read operations
  # Supported formats: json, csv, xml
  outputFormat: json

  # Default character encoding
  # Supported encodings: UTF-8, UTF-16, ISO-8859-1, GBK, GB2312
  encoding: UTF-8

# Read operation settings
read:
  # Whether to automatically trim whitespace from cell values
  autoTrim: true

  # Whether to ignore empty rows when reading
  ignoreEmptyRows: true

# Write operation settings
write:
  # Whether to automatically create parent directories for output files
  autoCreateDirectories: true

# Advanced settings (uncomment to modify)
# logging:
#   level: INFO
#   file: fesod-cli.log

# performance:
#   bufferSize: 8192
#   maxMemory: 512MB
